<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whisper Interview Transcriber</title>
    <link rel="stylesheet" href="/frontend/style.css" />
    </head>
    <body>
    <div class="container">
        <header class="header">
        <h1>Whisper Interview Transcriber</h1>
        <p>Envie um vídeo ou áudio, gere a transcrição e navegue pelos trechos clicando nos timestamps.</p>
        </header>

        <section class="upload-card">
        <input type="file" id="fileInput" accept="video/*,audio/*" />
        <label class="checkbox-label">
            <input type="checkbox" id="diarizationCheck" />
            Identificar quem está falando
        </label>
        <button id="uploadBtn">Transcrever</button>
        <span id="statusText">Aguardando arquivo...</span>
        </section>

        <!-- Painel de Logs -->
        <section class="logs-panel" id="logsPanel" style="display: none;">
        <div class="logs-header">
            <h3>📋 Logs do Processamento</h3>
            <button id="clearLogsBtn" class="clear-btn">Limpar</button>
        </div>
        <div id="logsList" class="logs-list"></div>
        </section>

        <section class="main-grid">
        <div class="player-panel">
            <h2>Player</h2>
            <video id="videoPlayer" controls></video>
        </div>

        <div class="transcript-panel">
            <div class="transcript-top">
            <h2>Transcrição</h2>
            <input type="text" id="searchInput" placeholder="Buscar palavra..." />
            <div class="download-buttons" id="downloadButtons" style="display: none;">
                <button class="download-btn" id="downloadTxt">📄 TXT</button>
                <button class="download-btn" id="downloadJson">📋 JSON</button>
                <button class="download-btn" id="downloadSrt">🎬 SRT</button>
            </div>
            </div>
            <div id="transcriptList" class="transcript-list">
            <div class="empty-state">Nenhuma transcrição carregada.</div>
            </div>
        </div>
        </section>
    </div>

    <script src="/frontend/app.js"></script>
</body>
</html>
